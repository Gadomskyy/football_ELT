version: 2

models:
  - name: pl_squads
    description: "Table containing all players for teams for all relevant PL seasons (24/25, 25/26, 26/27). Grain: Season + Player"
    columns:
      - name: season
        description: "Code for the season at which the team played in PL"
        data_tests:
          - not_null
      - name: team_id
        description: "Code uniquely identifying a team."
        data_tests:
          - not_null
      - name: team_name
        description: "Full name of the team."
        data_tests:
          - not_null
      - name: player_id
        description: "Unique identifier for a player."
        data_tests:
          - not_null
      - name: player_name
        description: "Full name of the player."
        data_tests:
          - not_null
      - name: position
        description: "Position of the player."
      - name: player_dob
        description: "DOB of the player. YYYY-MM-DD"
      - name: player_nationality
        description: "Nationality of the player."

      